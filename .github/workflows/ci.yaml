name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ferramentas (versões fixadas)
        run: ./scripts/setup-tools.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/pre-commit
            .cache/kubeconform
          key: lint-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (mesma config do WSL)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Testes das regras (make unit, no Node fixado)
        run: make unit
      - name: Placeholder trocado (scripts/init.sh)
        if: github.repository != 'bernats-homelab/repotpl-k8s-app'
        run: |
          if git grep -n 'app-template' -- deploy app; then
            echo "::error::Rode scripts/init.sh <nome> neste repo gerado a partir do template."
            exit 1
          fi

  # Sobe um k3s no runner (mesma versão do repo central) com a imagem construída aqui e o
  # overlay `ci` (Postgres simples + OTel Collector), e confere /healthz, a API com o banco
  # e a telemetria (traces e métricas chegando ao coletor).
  e2e:
    needs: [lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      K3S_VERSION: v1.37.1+k3s1
      K3S_INSTALL_SHA256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
      CI_IMAGE: docker.io/library/app-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ferramentas (versões fixadas)
        run: ./scripts/setup-tools.sh kustomize && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: k3s (versão e sha256 do instalador fixados)
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/k3s-install.sh" \
            "https://raw.githubusercontent.com/k3s-io/k3s/${K3S_VERSION//+/%2B}/install.sh"
          echo "${K3S_INSTALL_SHA256}  ${RUNNER_TEMP}/k3s-install.sh" | sha256sum --check -
          sudo INSTALL_K3S_VERSION="${K3S_VERSION}" INSTALL_K3S_EXEC="server --disable traefik" \
            sh "${RUNNER_TEMP}/k3s-install.sh"
          # O nó demora alguns segundos para se registrar; antes disso o wait não acha nada.
          timeout 120 bash -c 'until sudo k3s kubectl get nodes -o name 2>/dev/null | grep -q .; do sleep 2; done'
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=300s

      - name: Build da imagem e import no k3s
        run: |
          docker build -t "${CI_IMAGE}" .
          docker save "${CI_IMAGE}" | sudo k3s ctr images import -

      - name: Aplicar deploy/overlays/ci com a imagem do CI
        run: |
          work="$(mktemp -d)"
          cp -r deploy "${work}/"
          ./scripts/set-image.sh "${CI_IMAGE}" "${work}/deploy/base/kustomization.yaml"
          sudo k3s kubectl create namespace ci
          ./scripts/kustomize-build.sh "${work}/deploy/overlays/ci" | sudo k3s kubectl -n ci apply -f -
          echo "WORK=${work}" >> "$GITHUB_ENV"

      - name: deploy/base sozinha fica Available (como no e2e do repo central)
        run: |
          kubectl() { sudo k3s kubectl "$@"; }
          kubectl create namespace ci-base
          ./scripts/kustomize-build.sh "${WORK}/deploy/base" | kubectl -n ci-base apply -f -
          kubectl -n ci-base wait deployment --all --for=condition=Available --timeout=300s

      - name: Deployments Available e /healthz
        run: |
          kubectl() { sudo k3s kubectl "$@"; }
          kubectl -n ci wait deployment --all --for=condition=Available --timeout=300s
          svc="$(kubectl -n ci get service -l app.kubernetes.io/name=grocery-ops -o jsonpath='{.items[0].metadata.name}')"
          body="$(kubectl get --raw "/api/v1/namespaces/ci/services/${svc}:http/proxy/healthz")"
          [[ "${body}" == "ok" ]] || {
            echo "::error::/healthz respondeu '${body}'"
            exit 1
          }

      - name: API com o banco (migrações e seed de categorias)
        run: |
          kubectl() { sudo k3s kubectl "$@"; }
          svc="$(kubectl -n ci get service -l app.kubernetes.io/name=grocery-ops -o jsonpath='{.items[0].metadata.name}')"
          url="/api/v1/namespaces/ci/services/${svc}:http/proxy/api/categorias"
          for _ in $(seq 30); do
            if kubectl get --raw "${url}" 2>/dev/null | grep -q Hortifruti; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/categorias não respondeu com o seed"
          kubectl get --raw "${url}" || true
          exit 1

      - name: Telemetria no coletor (trace da API, span do banco e métricas)
        run: |
          kubectl() { sudo k3s kubectl "$@"; }
          esperados=(
            'service.name: Str(grocery-ops)'
            'GET /api/categorias'
            'SELECT categoria'
            'http.server.request.duration'
            'nodejs.eventloop'
          )
          for _ in $(seq 30); do
            logs="$(kubectl -n ci logs deployment/grocery-ops-otelcol --tail=-1)"
            faltando=()
            for e in "${esperados[@]}"; do
              grep -qF "${e}" <<<"${logs}" || faltando+=("${e}")
            done
            [[ ${#faltando[@]} -eq 0 ]] && exit 0
            sleep 2
          done
          printf '::error::coletor não recebeu: %s\n' "${faltando[@]}"
          exit 1

      - name: Diagnóstico
        if: failure()
        run: |
          sudo k3s kubectl -n ci get all -o wide || true
          sudo k3s kubectl -n ci-base get all -o wide || true
          sudo k3s kubectl -n ci-base logs deployment/grocery-ops --tail=50 || true
          sudo k3s kubectl -n ci describe pods || true
          sudo k3s kubectl -n ci logs deployment/grocery-ops --tail=100 || true
          sudo k3s kubectl -n ci logs deployment/grocery-ops-postgres --tail=50 || true
          sudo k3s kubectl -n ci logs deployment/grocery-ops-postgres --previous --tail=80 || true
          sudo k3s kubectl -n ci get events --sort-by=.lastTimestamp || true
          sudo k3s kubectl -n ci logs deployment/grocery-ops-otelcol --tail=200 || true
